# Packaged small CPU-runnable same-grid training example.
seed: [True, 1337]
model_id: 'mnist_same_grid'
bits: 64

batch_size: 8
num_epochs: 1
gpu_config: [False, [0]]
valid_rate: 0.1

paths:
  path_root: '.'
  path_data: 'data/'
  path_results: 'results/'
  path_checkpoint: 'my_models/'

diffraction_blocks:
  0:
    input_plane: &input_plane
      name: 'input_plane'
      center: [0, 0, 0]
      size: [6.4, 6.4]
      normal: [0, 0, 1]
      Nx: &input_x 64
      Ny: &input_y 64
    output_plane: &hidden_plane
      name: 'hidden_plane'
      center: [0, 0, 20]
      size: [6.4, 6.4]
      normal: [0, 0, 1]
      Nx: 64
      Ny: 64
    modulator_params:
      gradients: 'phase_only'
      amplitude_init: 'uniform'
      amplitude_value: 1.0
      phase_init: 'uniform'
      phase_value: 0.0
      focal_length: 'none'
      wavelength: &wavelength 520.e-6
    propagator_params: &propagator
      wavelength: *wavelength
      fft_type: 'pytorch'
      prop_type: 'asm'
      padded: True
  1:
    input_plane: *hidden_plane
    output_plane:
      name: 'output_plane'
      center: [0, 0, 40]
      size: [6.4, 6.4]
      normal: [0, 0, 1]
      Nx: 64
      Ny: 64
    modulator_params:
      gradients: 'none'
      amplitude_init: 'uniform'
      amplitude_value: 1.0
      phase_init: 'uniform'
      phase_value: 0.0
      focal_length: 'none'
      wavelength: *wavelength
    propagator_params: *propagator

dom_training:
  optimizer: 'ADAM'
  learning_rate: 1.e-2
  objective_function: 'mse'
  data_range: 1.0

which: 'MNIST'
n_cpus: 0
resize_row: 28
resize_col: 28
Nxp: *input_x
Nyp: *input_y

wavefront_transform:
  phase_initialization_strategy: 0
  bits: 64
